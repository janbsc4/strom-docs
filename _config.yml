# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Strom
description: >-
  Open-source smart heating: Strom reads day-ahead electricity prices and the
  weather forecast, then heats through the cheapest safe hours.
author_links:
  - name: "Jan Balanyà Scholl"
    url: "https://janbalanya.com"
baseurl: "/strom-docs" # the subpath of your site, e.g. /blog
url: "https://janbalanya.com" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  Bloodwing1/Strom
permalink: /:slug

# Social card for every page unless a page overrides it.
# English guide posts live in _posts/ (lang: en, URLs /:slug).
# Spanish guide posts live in _posts/es/ (lang: es, URLs /es/:slug).
# Each post/page carries a `ref` id linking its translations together.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      path: "_posts/es"
      type: posts
    values:
      lang: es
      permalink: /es/:slug
      image: /assets/images/og-image-es.png

# Build settings
# theme: minima
plugins:
  - jekyll-feed

# Exclude from processing.
# Repo files that are not site content, so they are not published to the site.
# A custom exclude list replaces Jekyll's built-in defaults, so the default
# entries (Gemfile, vendor/) must be repeated here.
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - script
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

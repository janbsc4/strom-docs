<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M13.6 1.6 4.2 13.4c-.4.5 0 1.3.7 1.3h5l-1.7 7.5c-.2.8.9 1.3 1.4.6l9.4-11.8c.4-.5 0-1.3-.7-1.3h-5l1.7-7.5c.2-.8-.9-1.3-1.4-.6Z" fill="#f2a33c"/>
      </svg>
      <span>{{ site.title | escape }}</span>
    </a>

    <nav class="site-nav" aria-label="Main">
      {%- assign docs_page = site.posts | where: "slug", "getting-started" | first -%}
      <a class="page-link {% if page.url == docs_page.url %}is-active{% endif %}" href="{{ site.baseurl }}/getting-started">Docs</a>
      <a class="page-link nav-github" href="https://github.com/{{ site.github_username }}">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
        </svg>
        <span class="github-label">GitHub</span>
      </a>
    </nav>
  </div>
</header>
